<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>中文女声音色选择</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { 
      text-align: center; 
      color: white; 
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.8);
      margin-bottom: 30px;
      font-size: 14px;
    }
    .voice-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .voice-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    .voice-desc {
      font-size: 14px;
      color: #888;
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 20px;
    }
    audio {
      width: 100%;
      height: 50px;
    }
    .hint {
      text-align: center;
      color: rgba(255,255,255,0.9);
      margin-top: 30px;
      font-size: 16px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ 中文女声音色选择</h1>
    <p class="subtitle">请试听以下6个非方言女声音色，为初中阶段选择</p>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">1. XiaoxiaoNeural</span>
        <span class="voice-desc">普通话</span>
      </div>
      <audio controls src="test_audio/all_female_voices/Xiaoxiao.mp3"></audio>
    </div>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">2. XiaoyiNeural</span>
        <span class="voice-desc">普通话</span>
      </div>
      <audio controls src="test_audio/all_female_voices/Xiaoyi.mp3"></audio>
    </div>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">3. HiuGaaiNeural</span>
        <span class="voice-desc">粤语</span>
      </div>
      <audio controls src="test_audio/all_female_voices/HiuGaai.mp3"></audio>
    </div>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">4. HiuMaanNeural</span>
        <span class="voice-desc">粤语</span>
      </div>
      <audio controls src="test_audio/all_female_voices/HiuMaan.mp3"></audio>
    </div>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">5. HsiaoChenNeural</span>
        <span class="voice-desc">台湾国语</span>
      </div>
      <audio controls src="test_audio/all_female_voices/HsiaoChen.mp3"></audio>
    </div>
    
    <div class="voice-card">
      <div class="voice-header">
        <span class="voice-name">6. HsiaoYuNeural</span>
        <span class="voice-desc">台湾国语</span>
      </div>
      <audio controls src="test_audio/all_female_voices/HsiaoYu.mp3"></audio>
    </div>
    
    <div class="hint">
      <strong>试听后告诉我：</strong><br>
      1. 哪个音色最适合<strong>初中阶段</strong>？<br>
      2. 各年龄段（幼儿园/小学/初中）分别用哪个？
    </div>
  </div>
</body>
</html>
