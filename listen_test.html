<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习内容试听（女声）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .subject-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .subject-title {
      font-size: 20px;
      color: #667eea;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }
    .age-group {
      margin-bottom: 20px;
    }
    .age-title {
      font-size: 16px;
      color: #888;
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 3px solid #667eea;
    }
    .topic-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .topic-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    .audio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .audio-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .audio-label {
      font-size: 14px;
      color: #666;
      min-width: 60px;
    }
    audio {
      flex: 1;
      height: 40px;
    }
    .duration {
      font-size: 12px;
      color: #999;
      min-width: 40px;
    }
    .empty {
      color: #999;
      font-style: italic;
      padding: 10px;
    }
    .footer {
      text-align: center;
      color: #666;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎧 学习内容试听（女声）</h1>
    <p class="subtitle">音色：zh-CN-XiaoxiaoNeural（温柔女声）</p>
    
    <!-- 健康领域 -->
    <div class="subject-section">
      <div class="subject-title">💚 健康领域</div>
      
      <div class="age-group">
        <div class="age-title">小班 (3-4岁)</div>
        
        <div class="topic-item">
          <div class="topic-name">认识高矮</div>
          <div class="audio-group">
            <div class="audio-item">
              <span class="audio-label">概念讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_stature_height/audio_concept.mp3"></audio>
            </div>
            <div class="audio-item">
              <span class="audio-label">详细讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_stature_height/audio_explanation.mp3"></audio>
            </div>
          </div>
        </div>
        
        <div class="topic-item">
          <div class="topic-name">认识身体部位</div>
          <div class="audio-group">
            <div class="audio-item">
              <span class="audio-label">概念讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_body_parts/audio_concept.mp3"></audio>
            </div>
            <div class="audio-item">
              <span class="audio-label">详细讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_body_parts/audio_explanation.mp3"></audio>
            </div>
          </div>
        </div>
        
        <div class="topic-item">
          <div class="topic-name">认识开心和难过</div>
          <div class="audio-group">
            <div class="audio-item">
              <span class="audio-label">概念讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_happy_sad/audio_concept.mp3"></audio>
            </div>
            <div class="audio-item">
              <span class="audio-label">详细讲解</span>
              <audio controls src="output/health/小班(3-4岁)/health_kg_happy_sad/audio_explanation.mp3"></audio>
            </div>
          </div>
        </div>
      </div>
      
      <div class="age-group">
        <div class="age-title">中班 (4-5岁)</div>
        
        <div class="topic-item">
          <div class="topic-name">表达自己情绪</div>
          <div class="audio-group">
            <div class="audio-item">
              <span class="audio-label">概念讲解</span>
              <audio controls src="output/health/中班(4-5岁)/health_kg_express_emotion/audio_concept.mp3"></audio>
            </div>
            <div class="audio-item">
              <span class="audio-label">详细讲解</span>
              <audio controls src="output/health/中班(4-5岁)/health_kg_express_emotion/audio_explanation.mp3"></audio>
            </div>
          </div>
        </div>
        
        <div class="topic-item">
          <div class="topic-name">认识冷热天气</div>
          <div class="audio-group">
            <div class="audio-item">
              <span class="audio-label">概念讲解</span>
              <span class="empty">⚠️ 音频生成失败</span>
            </div>
            <div class="audio-item">
              <span class="audio-label">详细讲解</span>
              <audio controls src="output/health/中班(4-5岁)/health_kg_weather/audio_explanation.mp3"></audio>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <p>共5个知识点，10个音频文件</p>
      <p style="margin-top:5px;">如需其他音色，请修改脚本中的 voice 参数</p>
    </div>
  </div>
</body>
</html>
